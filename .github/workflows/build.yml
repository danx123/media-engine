name: Build Media Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Pasang MSYS2 + Toolchain Lengkap
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          # ➕ DITAMBAHKAN: mingw-w64-x86_64-clang agar bindgen Rust tidak error
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-clang
            make
            diffutils
            autoconf
            automake
            libtool
            patch

      - name: Setup Environment (PATH & LIBCLANG)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          # Memastikan toolchain MSYS2 terdeteksi paling awal
          echo "$env:MSYS2_LOCATION\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:MSYS2_LOCATION\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # ➕ DITAMBAHKAN: Memberitahu Rust bindgen di mana letak libclang MSYS2
          echo "LIBCLANG_PATH=$env:MSYS2_LOCATION\mingw64\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ⚙️ UBAH: Set toolchain utama (host) langsung ke GNU agar tidak dianggap cross-compile
      - name: Pasang Rust (GNU Host)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Pasang Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Pasang Maturin
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install maturin

      - name: ⚙️ Kompilasi FFmpeg Statis + Modul
        timeout-minutes: 60
        shell: msys2 {0}
        env:
          FFMPEG_SYS_NEXT_NO_VCPKG: "1"
          FFMPEG_SYS_NEXT_USE_PKG_CONFIG: "0"
          CC: gcc
          CXX: g++
        # Target argumen bisa dilepas karena default toolchain sudah GNU
        run: maturin build --release --out dist

      - name: 📋 Hasil
        run: dir dist/

      - name: 📤 Unggah Artefak
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-py${{ matrix.python-version }}-windows
          path: dist/*.whl
