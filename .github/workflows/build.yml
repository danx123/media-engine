name: Build Media Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      # 🧱 FFmpeg (via ffmpeg-sys-next "build" feature) dikompilasi dari source
      # pakai autotools `configure`, yang butuh shell + toolchain ala Unix.
      # windows-latest gak punya ini secara default, jadi kita pasang MSYS2/mingw64.
      - name: Pasang MSYS2 + toolchain build FFmpeg
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkg-config
            make
            diffutils
            autoconf
            automake
            libtool
            patch

      - name: Tambahkan MSYS2/mingw64 ke PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "$env:MSYS2_LOCATION\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:MSYS2_LOCATION\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ⚠️ FFmpeg dikompilasi pakai gcc mingw-w64 (ABI GNU), jadi hasil .a-nya
      # gak kompatibel dengan linker MSVC. Rust toolchain HARUS diarahkan ke
      # target windows-gnu biar seluruh rantai (rustc + ar + linker) sinkron.
      - name: Pasang Rust (target windows-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu

      - name: Pasang Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pasang Maturin
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install maturin

      - name: ⚙️ Kompilasi FFmpeg Statis + Modul
        timeout-minutes: 60
        shell: pwsh
        env:
          FFMPEG_SYS_NEXT_NO_VCPKG: "1"
          FFMPEG_SYS_NEXT_USE_PKG_CONFIG: "0"
          # dtolnay/rust-toolchain gak otomatis ganti default host target,
          # jadi kita paksa cargo/maturin pakai target gnu di sini.
          CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
        run: maturin build --release --target x86_64-pc-windows-gnu --out dist

      - name: 📋 Hasil
        run: dir dist/

      - name: 📤 Unggah Artefak
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-py${{ matrix.python-version }}-windows
          path: dist/*.whl
