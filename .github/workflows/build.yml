name: Build Media Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cross-build-windows:
    name: Cross-compile Windows wheel (abi3)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 🧱 mingw-w64 = compiler + linker buat target Windows.
      # Paket -posix WAJIB dipilih (bukan -win32) karena FFmpeg butuh pthreads,
      # dan varian -win32 mingw-w64 default di Ubuntu gak punya itu.
      - name: Pasang toolchain cross mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            nasm \
            yasm \
            pkg-config \
            make \
            diffutils \
            autoconf \
            automake \
            libtool \
            patch

          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Pasang Rust + target windows-gnu
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu

      - name: Pasang Python (host, buat jalanin maturin)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang Maturin
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install maturin

      # 🔧 Cargo perlu tau linker mana yang dipakai buat target windows-gnu.
      - name: Setup linker cargo buat target windows-gnu
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-ar"
          EOF

      # ⚙️ ffmpeg-sys-next otomatis mendeteksi cross-compile (TARGET != HOST)
      # dan menyusun --cross-prefix/--arch/--target-os sendiri dari compiler
      # x86_64-w64-mingw32-gcc yang barusan dipasang, jadi gak perlu diset manual.
      - name: ⚙️ Kompilasi FFmpeg Statis + Modul (cross ke Windows)
        timeout-minutes: 60
        env:
          FFMPEG_SYS_NEXT_NO_VCPKG: "1"
          FFMPEG_SYS_NEXT_USE_PKG_CONFIG: "0"
        run: maturin build --release --target x86_64-pc-windows-gnu --out dist

      - name: 📋 Hasil
        run: ls -la dist/

      - name: 📤 Unggah Artefak
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-windows-abi3
          path: dist/*.whl
