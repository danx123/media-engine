name: Build Media Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      # 1. Gunakan Toolchain murni Windows (MSVC) untuk kompatibilitas 100% dengan CPython
      - name: Pasang Rust (MSVC Host)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Pasang Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Pasang Maturin & Delvewheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install maturin delvewheel

      # 2. Unduh FFmpeg siap pakai (berisi Header .h, Library .lib, dan Binary .dll MSVC-compatible)
      - name: 📥 Unduh FFmpeg Prebuilt (Gyan.dev)
        shell: pwsh
        run: |
          echo "Mengunduh FFmpeg Shared..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" -OutFile "ffmpeg.7z"
          echo "Mengekstrak file..."
          7z x ffmpeg.7z -oC:\ffmpeg_build
          $folder = Get-ChildItem C:\ffmpeg_build -Directory | Select-Object -First 1
          # ⚙️ UBAH: Gunakan Move-Item alih-alih Rename-Item
          Move-Item -Path $folder.FullName -Destination C:\ffmpeg
          echo "Berhasil! Direktori FFmpeg siap di C:\ffmpeg"

      # 3. Otomatis membersihkan Cargo.toml dari mode kompilasi source
      - name: ⚙️ Sesuaikan Cargo.toml (Hapus fitur Build/Static)
        shell: python
        run: |
          import re
          with open('Cargo.toml', 'r', encoding='utf-8') as f:
              data = f.read()
          # Menghapus paksa "build" dan "static" agar beralih ke mode Dynamic Link
          data = re.sub(r'"static"\s*,?\s*', '', data)
          data = re.sub(r'"build"\s*,?\s*', '', data)
          with open('Cargo.toml', 'w', encoding='utf-8') as f:
              f.write(data)

      # 4. Bindgen & Cargo akan otomatis mengambil header/lib dari FFMPEG_DIR
      - name: ⚙️ Kompilasi Modul Python (Maturin)
        env:
          FFMPEG_DIR: "C:\\ffmpeg"
        run: maturin build --release --out dist_tmp

      # 5. Delvewheel akan menyedot avcodec.dll dkk dari C:\ffmpeg\bin ke dalam Wheel
      - name: 📦 Bundle DLL ke dalam Wheel (Delvewheel)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $env:PATH += ";C:\ffmpeg\bin"
          Get-ChildItem dist_tmp/*.whl | ForEach-Object {
              delvewheel repair $_.FullName -w dist/ --add-path C:\ffmpeg\bin
          }

      - name: 📋 Hasil Akhir
        run: dir dist/

      - name: 📤 Unggah Artefak Python Wheel
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-py${{ matrix.python-version }}-windows
          path: dist/*.whl
