name: Build Media Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      # 1. Pasang Lingkungan MSYS2 beserta FFmpeg Pre-built
      - name: Pasang MSYS2 + FFmpeg Pre-built
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ffmpeg

      # 2. Daftarkan path compiler dan library MSYS2 agar terdeteksi
      - name: Setup Environment (PATH)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          echo "$env:MSYS2_LOCATION\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:MSYS2_LOCATION\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 3. Sinkronisasi compiler Rust ke lingkungan GNU
      - name: Pasang Rust (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Pasang Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      # 4. Instal Maturin & Delvewheel (untuk injeksi DLL)
      - name: Pasang Tools Build & Bundling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install maturin delvewheel

      # 5. Modifikasi Cargo.toml secara dinamis agar tidak kompilasi ulang FFmpeg
      - name: ⚙️ Sesuaikan Cargo.toml (Khusus Windows)
        shell: bash
        run: |
          # Menghapus paksa tag "build" dan "static" menggunakan sed
          sed -i 's/"build",//g' Cargo.toml
          sed -i 's/"static",//g' Cargo.toml

      # 6. Kompilasi Modul (Otomatis mendeteksi FFmpeg dari MSYS2 via pkg-config)
      - name: ⚙️ Kompilasi Modul Python
        timeout-minutes: 20
        run: maturin build --release --out dist_tmp

      # 7. Membungkus DLL yang dibutuhkan langsung ke dalam Wheel
      - name: 📦 Inject DLL ke dalam Wheel (Delvewheel)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem dist_tmp/*.whl | ForEach-Object {
              delvewheel repair $_.FullName -w dist/
          }

      - name: 📋 Hasil
        run: dir dist/

      - name: 📤 Unggah Artefak
        uses: actions/upload-artifact@v4
        with:
          name: media-engine-py${{ matrix.python-version }}-windows
          path: dist/*.whl
