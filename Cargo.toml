[package]
name = "media_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
ndarray = "0.15"

# ✅ FFmpeg: nyalakan fitur yang dibutuhkan SAJA, tetap statis
ffmpeg-next = { version = "7.0", features = [
    "static",   # ← Dikompilasi statis
    "build",    # ← Bangun dari sumber
    "codec",    # ← Dekoder/enkoder (WAJIB!)
    "format",   # ← Baca format file (WAJIB!)
    "resample", # ← Konversi sampel
    "scale"     # ← Ubah ukuran/pixel
], default-features = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
